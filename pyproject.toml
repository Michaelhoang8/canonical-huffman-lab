[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canonical-huffman-lab"
version = "1.0.0"
description = "Canonical Huffman codec and reproducible synthetic compression study"
requires-python = ">=3.11"

[project.scripts]
chuf = "huffman_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
