name: Validate codec and evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the standard-library codec
        run: python -m pip install -e .
      - name: Check codec and preserved evidence
        run: python -m unittest discover -s tests -v
      - name: Measure a separate fresh experiment
        run: python scripts/run_study.py --out outputs/ci-reproduction --repetitions 3
      - name: Reconcile fresh measurements
        env:
          HUFFMAN_RESULTS: outputs/ci-reproduction
        run: python -m unittest discover -s tests -p test_evidence.py -v
      - name: Preserve CI measurements
        uses: actions/upload-artifact@v4
        with:
          name: compression-ci-measurements
          path: outputs/ci-reproduction
